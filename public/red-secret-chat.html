<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RED SECRET CHAT — QR Generator & Secret Log — MARAUDER</title>
  <style>
    body { font-family: monospace; background: #09090b; color: #f4f4f5; margin: 0; padding: 18px; line-height: 1.5; }
    .box { max-width: 920px; margin: 0 auto; background: #111115; border: 1px solid #f87171; border-radius: 10px; padding: 16px; }
    .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid #27272a; padding-bottom: 10px; margin-bottom: 14px; }
    a { color: #38bdf8; text-decoration: none; margin-right: 10px; }
    a:hover { text-decoration: underline; }
    input, button { font-family: monospace; }
    button { padding: 7px 12px; border-radius: 6px; border: 1px solid #52525b; background: #18181b; color: #fff; cursor: pointer; font-weight: bold; }
    pre { background: #09090b; border: 1px solid #27272a; padding: 10px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="box">
    <div class="top">
      <h2 style="margin:0;color:#f87171;">RED SECRET CHAT — QR Generator & Secret Log</h2>
      <div>
        <a href="/index.html">Начало</a>
        <a href="/kali-root.html">Linux Конзола</a>
        <a href="/mining-optin.html">Pool &amp; 24h</a>
        <a href="/devanport-studio.html">DEVANPORT-AI</a>
        <a href="/red-secret-chat.html">Secret Chat + QR</a>
        <a href="/payments-plans.html">Плащания</a>
        <a href="/downloads.html">Downloads</a>
        <a href="/tools-hub.html">Модули</a>
      </div>
    </div>
    
  <p style="font-size:12px;color:#fca5a5;">Отделна страница за секретни бележки, кодове и QR генератор.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;">
    <div>
      <input id="qrTxt" type="text" placeholder="Текст или код за QR..." style="width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #52525b;background:#09090b;color:#fff;margin-bottom:8px;" />
      <button id="qrDrawBtn" type="button" style="border-color:#ef4444;background:#7f1d1d;">Генерирай QR</button>
      <div style="margin-top:10px;padding:10px;background:#fff;border-radius:8px;display:inline-block;">
        <canvas id="qrC" width="160" height="160"></canvas>
      </div>
    </div>
    <div>
      <input id="secTxt" type="text" placeholder="Секретно съобщение..." style="width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #52525b;background:#09090b;color:#fff;margin-bottom:8px;" />
      <button id="secAddBtn" type="button" style="border-color:#22c55e;background:#14532d;">Запази</button>
      <button id="secClrBtn" type="button" style="border-color:#ef4444;background:#450a0a;">Изчисти</button>
      <pre id="secLog" style="margin-top:10px;">Няма записи.</pre>
    </div>
  </div>
  <script>
    (function(){
      var key = "marauder_red_secret_msgs_v1";
      var qrTxt = document.getElementById("qrTxt");
      var qrBtn = document.getElementById("qrDrawBtn");
      var c = document.getElementById("qrC");
      var secTxt = document.getElementById("secTxt");
      var addBtn = document.getElementById("secAddBtn");
      var clrBtn = document.getElementById("secClrBtn");
      var log = document.getElementById("secLog");
      function draw(t){
        var ctx = c.getContext("2d");
        var v = String(t || "RED-SECRET");
        var sz = 21, cell = Math.floor(c.width / sz), h = 2166136261;
        for (var i = 0; i < v.length; i++) { h ^= v.charCodeAt(i); h = Math.imul(h, 16777619); }
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = "#09090b";
        for (var r = 0; r < sz; r++) for (var col = 0; col < sz; col++) {
          var f = (r < 7 && col < 7) || (r < 7 && col >= sz-7) || (r >= sz-7 && col < 7);
          var d = false;
          if (f) {
            var lr = r < 7 ? r : r - (sz-7), lc = col < 7 ? col : col - (sz-7);
            d = (lr===0||lr===6||lc===0||lc===6||(lr>=2&&lr<=4&&lc>=2&&lc<=4));
          } else {
            var s = (h ^ (r*73856093) ^ (col*19349663) ^ v.charCodeAt(r % v.length));
            d = ((s >>> ((r+col)%16)) & 1) === 1;
          }
          if (d) ctx.fillRect(col*cell, r*cell, cell, cell);
        }
      }
      function load(){ try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch(_){ return []; } }
      function save(a){ try { localStorage.setItem(key, JSON.stringify(a)); } catch(_){ } }
      function render(){ var a = load(); log.textContent = a.length ? a.join("\n") : "Няма записи."; }
      qrBtn.addEventListener("click", function(){ draw((qrTxt.value || "").trim() || "RED-SECRET"); });
      addBtn.addEventListener("click", function(){
        var v = (secTxt.value || "").trim(); if (!v) return;
        var a = load(); a.push("[" + new Date().toLocaleTimeString() + "] " + v);
        save(a.slice(-40)); secTxt.value = ""; render();
      });
      clrBtn.addEventListener("click", function(){ save([]); render(); });
      draw("RED-SECRET"); render();
    })();
  </script>
  
  </div>
</body>
</html>
