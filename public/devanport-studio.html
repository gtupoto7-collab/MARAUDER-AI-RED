    body { font-family: monospace; background: #09090b; color: #f4f4f5; margin: 0; padding: 18px; line-height: 1.5; }
    .box { max-width: 920px; margin: 0 auto; background: #111115; border: 1px solid #fbbf24; border-radius: 10px; padding: 16px; }
    .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid #27272a; padding-bottom: 10px; margin-bottom: 14px; }
    a { color: #38bdf8; text-decoration: none; margin-right: 10px; }
    a:hover { text-decoration: underline; }
    input, button { font-family: monospace; }
    button { padding: 7px 12px; border-radius: 6px; border: 1px solid #52525b; background: #18181b; color: #fff; cursor: pointer; font-weight: bold; }
    pre { background: #09090b; border: 1px solid #27272a; padding: 10px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="box">
    <div class="top">
      <h2 style="margin:0;color:#fbbf24;">DEVANPORT-AI — Software Generator & Auto-Save</h2>
      <div>
        <a href="/index.html">Начало</a>

    </div>
    
  <p style="font-size:12px;color:#d4d4d8;">Отделна страница за генериране на нови софтуерни инструменти и кодове с автоматично запазване.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
    <input id="devNameInp" type="text" placeholder="Име на инструмент (напр. audit-check.sh)" style="flex:1;min-width:220px;padding:8px;border-radius:6px;border:1px solid #52525b;background:#09090b;color:#fff;" />
    <button id="devGenBtn" type="button" style="border-color:#22c55e;background:#14532d;">Генерирай и Авто-Запази</button>
  </div>
  <pre id="devOut">Зареждане...</pre>
  <script>
    (function(){
      var key = "marauder_devanport_saved_tools_v1";
      var inp = document.getElementById("devNameInp");
      var btn = document.getElementById("devGenBtn");
      var out = document.getElementById("devOut");
      function load(){ try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch(_){ return []; } }
      function save(a){ try { localStorage.setItem(key, JSON.stringify(a)); } catch(_){ } }
      function render(){
        var a = load();
        out.textContent = a.length ? a.map(function(x, i){ return "[" + (i+1) + "] " + x.name + " (" + x.savedAt + ")\n" + x.code; }).join("\n---\n") : "Няма запазени инструменти още.";
      }
      btn.addEventListener("click", function(){
        var nm = (inp.value || "").trim() || ("marauder-tool-" + (load().length + 1) + ".sh");
        var code = "#!/usr/bin/env bash\n# DEVANPORT-AI Auto-Saved Tool\necho \"Running " + nm.replace(/"/g, "") + "\"\n";
        var a = load();
        a.unshift({ name: nm, code: code, savedAt: new Date().toISOString() });
        save(a.slice(0, 30));
        render();
      });
      render();
    })();
  </script>
  
  </div>
</body>
