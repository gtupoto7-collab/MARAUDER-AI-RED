<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MARAUDER — ULTIMATE HACKER CONSOLE v12.0 AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100%;
      background: #070406;
      color: #f5f5f5;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }
    .stage-wrap {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 12px 24px;
      gap: 10px;
      background:
        radial-gradient(circle at 50% 10%, rgba(220, 20, 40, 0.22), transparent 55%),
        #070406;
    }
    .live-toolbar {
      width: 100%;
      max-width: 1360px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(18, 6, 10, 0.92);
      border: 1px solid rgba(255, 45, 70, 0.55);
      border-radius: 6px;
      box-shadow: 0 0 18px rgba(255, 25, 50, 0.2);
      font-size: 12px;
    }
    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-weight: 600;
      letter-spacing: 0.4px;
    }
    .badge-ok {
      color: #6dff9b;
      border-color: rgba(109, 255, 155, 0.45);
      background: rgba(20, 120, 55, 0.2);
    }
    .badge-timer {
      color: #ff6b7a;
      border-color: rgba(255, 107, 122, 0.55);
      background: rgba(140, 15, 30, 0.28);
      font-variant-numeric: tabular-nums;
    }
    .btn {
      cursor: pointer;
      border: 1px solid rgba(255, 75, 95, 0.7);
      background: linear-gradient(180deg, #5c0c17, #2c050a);
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .btn:hover { filter: brightness(1.2); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-green {
      border-color: rgba(80, 235, 130, 0.75);
      background: linear-gradient(180deg, #165e32, #0b2e18);
    }

    /* 1:1 визуална сцена със снимката MARAUDER-AI.jpg */
    .console-frame {
      position: relative;
      width: 100%;
      max-width: 1360px;
      aspect-ratio: 16 / 9;
      border: 2px solid rgba(255, 38, 62, 0.75);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 36px rgba(255, 20, 45, 0.35);
      background: #050203;
    }
    .console-frame img.ref-bg {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* Живи интерактивни зони върху ключовите контроли на снимката */
    .hot-key {
      position: absolute;
      left: 26.2%;
      top: 38.6%;
      width: 15.8%;
      height: 3.1%;
      background: rgba(0, 0, 0, 0.72);
      border: 1px solid rgba(255, 80, 100, 0.65);
      color: #ffd6dc;
      font-size: clamp(9px, 1vw, 13px);
      font-family: Consolas, monospace;
      padding: 0 6px;
      border-radius: 3px;
    }
    .hot-pass {
      position: absolute;
      left: 26.2%;
      top: 43.2%;
      width: 15.8%;
      height: 3.1%;
      background: rgba(0, 0, 0, 0.72);
      border: 1px solid rgba(255, 80, 100, 0.65);
      color: #ffd6dc;
      font-size: clamp(9px, 1vw, 13px);
      font-family: Consolas, monospace;
      padding: 0 6px;
      border-radius: 3px;
    }
    .hot-gen-btn {
      position: absolute;
      left: 20.6%;
      top: 48.2%;
      width: 22.8%;
      height: 3.7%;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .hot-gen-btn:hover { background: rgba(255, 60, 80, 0.18); }

    .hot-connect-btn {
      position: absolute;
      left: 44.5%;
      top: 48.2%;
      width: 24.4%;
      height: 3.7%;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .hot-connect-btn:hover { background: rgba(60, 235, 120, 0.18); }

    .hot-chat-log {
      position: absolute;
      left: 20.5%;
      top: 54.4%;
      width: 48.4%;
      height: 22.2%;
      overflow-y: auto;
      padding: 6px 10px;
      background: rgba(8, 5, 10, 0.84);
      border: 1px solid rgba(255, 50, 75, 0.4);
      font-size: clamp(10px, 1.05vw, 13px);
      line-height: 1.35;
    }
    .chat-line { margin-bottom: 5px; word-break: break-word; }
    .chat-meta { color: #ff8a98; font-size: 0.85em; margin-right: 6px; }
    .chat-ai { color: #9be7ff; }
    .chat-user { color: #a7ffbe; }
    .chat-sys { color: #ffd37a; }

    .hot-chat-input {
      position: absolute;
      left: 20.5%;
      top: 77.3%;
      width: 41.8%;
      height: 3.5%;
      background: rgba(12, 8, 14, 0.92);
      border: 1px solid rgba(255, 75, 95, 0.65);
      color: #ffffff;
      padding: 0 8px;
      font-size: clamp(10px, 1vw, 13px);
      border-radius: 3px;
    }
    .hot-send-btn {
      position: absolute;
      left: 62.7%;
      top: 77.3%;
      width: 6.2%;
      height: 3.5%;
      background: rgba(235, 55, 35, 0.92);
      border: 1px solid rgba(255, 140, 120, 0.85);
      color: #fff;
      font-weight: 700;
      font-size: clamp(10px, 1vw, 13px);
      border-radius: 3px;
      cursor: pointer;
    }
    .hot-send-btn:hover { filter: brightness(1.15); }

    .hot-timer {
      position: absolute;
      right: 6.2%;
      top: 41.2%;
      width: 11.5%;
      text-align: center;
      font-family: Consolas, monospace;
      font-weight: 800;
      font-size: clamp(16px, 2.2vw, 30px);
      color: #ff465a;
      text-shadow: 0 0 12px rgba(255, 40, 60, 0.85);
      background: rgba(10, 3, 5, 0.72);
      border-radius: 4px;
      padding: 2px 4px;
      pointer-events: none;
    }

    .hot-mic-btn {
      position: absolute;
      right: 12.2%;
      top: 71.2%;
      width: 11.2%;
      height: 3.6%;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .hot-mic-btn:hover { background: rgba(109, 255, 155, 0.16); }

    .hot-file-input { display: none; }
    .hot-attach-btn {
      position: absolute;
      left: 26.8%;
      top: 81.3%;
      width: 6.8%;
      height: 3.2%;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .hot-attach-btn:hover { background: rgba(255, 255, 255, 0.14); }
  </style>
</head>
<body>
  <div class="stage-wrap">
    <div class="live-toolbar">
      <div class="toolbar-group">
        <span class="badge badge-ok" id="backendBadge">BACKEND: CHECKING...</span>
        <span class="badge badge-timer" id="topTimerBadge">AUTO DELETE: 03:00</span>
        <span class="badge" id="secretStatusBadge">SECRET CHAT: READY</span>
      </div>
      <div class="toolbar-group">
        <button class="btn" id="btnGenKey">GENERATE NEW KEY</button>
        <button class="btn btn-green" id="btnConnect">ENTER &amp; CONNECT</button>
        <button class="btn" id="btnResetTimer">RESET 03:00</button>
        <button class="btn" id="btnPingApi">PING API</button>
      </div>
    </div>

    <div class="console-frame" id="consoleFrame">
      <img class="ref-bg" src="/images/marauder-1to1.jpg" alt="MARAUDER ULTIMATE HACKER CONSOLE v12.0 AI" />

      <input type="text" class="hot-key" id="keyInput" value="MRD-7XQ9-KL2F-8V6P" aria-label="Encryption Key" />
      <input type="text" class="hot-pass" id="passInput" value="zF9k-Qp3m-7H2v" aria-label="Password" />

      <button type="button" class="hot-gen-btn" id="hotGenBtn" title="Генерирай нов ключ и парола"></button>
      <button type="button" class="hot-connect-btn" id="hotConnectBtn" title="Свържи секретния чат"></button>

      <div class="hot-chat-log" id="chatLog">
        <div class="chat-line chat-sys"><span class="chat-meta">[23:47:12]</span>MARAUDER: Секретен чат е активиран! Съобщенията ще се изтрият след 3 минути.</div>
        <div class="chat-line chat-ai"><span class="chat-meta">[23:47:20]</span>AI Agent (Mythos): Готов съм. Кажи ми какво искаш да направим?</div>
        <div class="chat-line chat-user"><span class="chat-meta">[23:47:28]</span>Ти: Изпращам ти снимка и видео...</div>
      </div>

      <input type="text" class="hot-chat-input" id="chatInput" placeholder="Напиши съобщение..." />
      <button type="button" class="hot-send-btn" id="sendBtn">Send</button>

      <input type="file" id="filePicker" class="hot-file-input" multiple />
      <button type="button" class="hot-attach-btn" id="attachBtn" title="Прикачи файл"></button>

      <div class="hot-timer" id="overlayTimer">03:00</div>
      <button type="button" class="hot-mic-btn" id="micBtn" title="Превключи Microphone 2.0"></button>
    </div>
  </div>

  <script>
    (function () {
      const chatLog = document.getElementById("chatLog");
      const chatInput = document.getElementById("chatInput");
      const sendBtn = document.getElementById("sendBtn");
      const keyInput = document.getElementById("keyInput");
      const passInput = document.getElementById("passInput");
      const filePicker = document.getElementById("filePicker");
      const attachBtn = document.getElementById("attachBtn");
      const micBtn = document.getElementById("micBtn");
      const overlayTimer = document.getElementById("overlayTimer");
      const topTimerBadge = document.getElementById("topTimerBadge");
      const secretStatusBadge = document.getElementById("secretStatusBadge");
      const backendBadge = document.getElementById("backendBadge");

      let remainingSeconds = 180;
      let micActive = true;

      function nowTime() {
        const d = new Date();
        return d.toTimeString().slice(0, 8);
      }

      function appendMsg(roleClass, sender, text) {
        const div = document.createElement("div");
        div.className = "chat-line " + roleClass;
        const meta = document.createElement("span");
        meta.className = "chat-meta";
        meta.textContent = "[" + nowTime() + "]";
        div.appendChild(meta);
        div.appendChild(document.createTextNode(sender + ": " + text));
        chatLog.appendChild(div);
        chatLog.scrollTop = chatLog.scrollHeight;
      }

      function formatTimer(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, "0");
        const s = String(sec % 60).padStart(2, "0");
        return m + ":" + s;
      }

      function resetTimer() {
        remainingSeconds = 180;
        const formatted = formatTimer(remainingSeconds);
        overlayTimer.textContent = formatted;
        topTimerBadge.textContent = "AUTO DELETE: " + formatted;
      }

      setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds -= 1;
        } else {
          chatLog.innerHTML = "";
          appendMsg("chat-sys", "SYSTEM", "Таймерът 03:00 изтече — съобщенията са изтрити автоматично.");
          remainingSeconds = 180;
        }
        const formatted = formatTimer(remainingSeconds);
        overlayTimer.textContent = formatted;
        topTimerBadge.textContent = "AUTO DELETE: " + formatted;
      }, 1000);

      function randomSegment(len, chars) {
        let out = "";
        for (let i = 0; i < len; i++) {
          out += chars[Math.floor(Math.random() * chars.length)];
        }
        return out;
      }

      function generateNewKey() {
        const alpha = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        const mixed = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
        keyInput.value = "MRD-" + randomSegment(4, alpha) + "-" + randomSegment(4, alpha) + "-" + randomSegment(4, alpha);
        passInput.value = randomSegment(4, mixed) + "-" + randomSegment(4, mixed) + "-" + randomSegment(4, mixed);
        appendMsg("chat-sys", "KEYGEN", "Нов ключ генериран: " + keyInput.value);
      }

      async function connectSecretChat() {
        secretStatusBadge.textContent = "SECRET CHAT: CONNECTED";
        appendMsg("chat-sys", "SECRET LINK", "Свързано към канал [" + keyInput.value + "] с авто-изтриване 03:00.");
        try {
          const res = await fetch("/api/defense/fusion/status");
          if (res.ok) {
            backendBadge.textContent = "BACKEND: ONLINE";
            backendBadge.className = "badge badge-ok";
          }
        } catch (_) {}
      }

      async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;
        chatInput.value = "";
        appendMsg("chat-user", "Ти", text);

        try {
          const res = await fetch("/api/mythos/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, key: keyInput.value })
          });
          if (res.ok) {
            const data = await res.json();
            const reply = data.reply || data.response || data.message || ("Mythos прие командата: " + text);
            appendMsg("chat-ai", "AI Agent (Mythos)", reply);
            return;
          }
        } catch (_) {}

        appendMsg("chat-ai", "AI Agent (Mythos)", "Прието (" + keyInput.value + "): „" + text + "“. Готов за следваща команда.");
      }

      async function pingBackend() {
        try {
          const res = await fetch("/api/defense/fusion/status");
          if (res.ok) {
            const j = await res.json();
            backendBadge.textContent = "BACKEND: ONLINE (" + (j.tracks ? j.tracks.length : "OK") + ")";
            backendBadge.className = "badge badge-ok";
            appendMsg("chat-sys", "API", "Бекендът отговори успешно.");
            return;
          }
        } catch (_) {}
        backendBadge.textContent = "BACKEND: LOCAL/STANDBY";
        appendMsg("chat-sys", "API", "Локален режим — конзолата работи активно.");
      }

      document.getElementById("btnGenKey").addEventListener("click", generateNewKey);
      document.getElementById("hotGenBtn").addEventListener("click", generateNewKey);
      document.getElementById("btnConnect").addEventListener("click", connectSecretChat);
      document.getElementById("hotConnectBtn").addEventListener("click", connectSecretChat);
      document.getElementById("btnResetTimer").addEventListener("click", () => {
        resetTimer();
        appendMsg("chat-sys", "TIMER", "Таймерът е нулиран на 03:00.");
      });
      document.getElementById("btnPingApi").addEventListener("click", pingBackend);

      sendBtn.addEventListener("click", sendMessage);
      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          sendMessage();
        }
      });

      attachBtn.addEventListener("click", () => filePicker.click());
      filePicker.addEventListener("change", () => {
        if (!filePicker.files || !filePicker.files.length) return;
        const names = Array.from(filePicker.files).map((f) => f.name).join(", ");
        appendMsg("chat-user", "Ти [FILE]", "Прикачен файл: " + names);
        appendMsg("chat-ai", "AI Agent (Mythos)", "Получих файла (" + names + ") в криптираната сесия.");
      });

      micBtn.addEventListener("click", () => {
        micActive = !micActive;
        appendMsg("chat-sys", "MICROPHONE 2.0", micActive ? "Микрофонът е активен (Voice Active)." : "Микрофонът е изключен (Muted).");
      });

      resetTimer();
      pingBackend();
    })();
  </script>
</body>
</html>
