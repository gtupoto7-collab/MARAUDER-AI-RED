<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MARAUDER-AI made by RED-SOFTWARE-TEAM-BG</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes rgbShift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    @keyframes neonPulse {
      0%, 100% {
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.55), 0 0 22px rgba(255, 0, 128, 0.35);
      }
      50% {
        box-shadow: 0 0 16px rgba(255, 50, 50, 0.75), 0 0 28px rgba(0, 255, 136, 0.45);
      }
    }

    html, body {
      background: #050508;
      color: #f3f4f6;
      font-family: "Consolas", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      position: relative;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .skull-col {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 72px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      padding: 6px 4px;
      background: #08090e;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
      animation: rgbShift 5s linear infinite;
    }

    .skull-col.left {
      left: 0;
      border-right: 2px solid #00f5d4;
      box-shadow: 2px 0 16px rgba(0, 245, 212, 0.4);
    }

    .skull-col.right {
      right: 0;
      border-left: 2px solid #ff007f;
      box-shadow: -2px 0 16px rgba(255, 0, 127, 0.4);
    }

    .skull-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      line-height: 1;
      color: #ff2a55;
      text-shadow: 0 0 8px currentColor;
      user-select: none;
      animation: rgbShift 3.5s linear infinite;
    }

    .app-shell {
      width: 100%;
      max-width: 800px;
      margin: 0 78px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #0d0e14;
      border-left: 2px solid #00f5d4;
      border-right: 2px solid #ff007f;
      box-shadow: 0 0 35px rgba(0, 245, 212, 0.22), 0 0 55px rgba(255, 0, 127, 0.18);
      position: relative;
      z-index: 2;
    }

    header {
      padding: 12px 14px;
      background: linear-gradient(90deg, #11131d 0%, #17101c 100%);
      border-bottom: 2px solid #00f5d4;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      animation: neonPulse 4s ease-in-out infinite;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .emblem-box {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14111d;
      border: 1.5px solid #00f5d4;
      border-radius: 8px;
      flex-shrink: 0;
      animation: rgbShift 4s linear infinite;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #ff3355;
      text-shadow: 0 0 10px rgba(255, 51, 85, 0.75);
      animation: rgbShift 4s linear infinite;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 800;
      color: #00f5d4;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(0, 245, 212, 0.65);
      animation: rgbShift 6s linear infinite reverse;
    }

    .symbol-strip {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      background: #090a10;
      border: 1px solid rgba(0, 245, 212, 0.35);
      border-radius: 6px;
      font-size: 13px;
      animation: rgbShift 3s linear infinite;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    select, input[type="password"], input[type="text"] {
      background: #08090d;
      color: #f3f4f6;
      border: 1px solid #00f5d4;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
      max-width: 100%;
    }

    select:focus, input:focus {
      border-color: #ff007f;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
    }

    .api-input {
      flex: 1 1 200px;
      min-width: 0;
    }

    button {
      background: #171926;
      color: #ffffff;
      border: 1px solid #00f5d4;
      border-radius: 6px;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.2s, border-color 0.2s;
      animation: rgbShift 5s linear infinite;
    }

    button:active {
      transform: scale(0.98);
      border-color: #ff007f;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.6);
    }

    button.danger {
      border-color: #ff2a55;
      color: #ff8099;
    }

    button.primary {
      background: linear-gradient(90deg, #b5179e, #ff2a55);
      border-color: #00f5d4;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 42, 85, 0.55);
    }

    #messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 92%;
      padding: 10px 13px;
      border-radius: 8px;
      line-height: 1.48;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #1e1022;
      border: 1px solid #ff007f;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.25);
      color: #fff5f8;
    }

    .msg.ai {
      align-self: flex-start;
      background: #101622;
      border: 1px solid #00f5d4;
      box-shadow: 0 0 10px rgba(0, 245, 212, 0.2);
      color: #e6fffa;
    }

    .msg.sys {
      align-self: center;
      background: #12131c;
      border: 1px dashed #00f5d4;
      color: #9ef9eb;
      font-size: 12px;
    }

    .attachments-preview {
      padding: 0 14px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .att-chip {
      background: #151724;
      border: 1px solid #00f5d4;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }

    .att-chip img {
      width: 34px;
      height: 34px;
      object-fit: cover;
      border-radius: 4px;
    }

    .composer {
      padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
      background: #0e1018;
      border-top: 2px solid #ff007f;
      box-shadow: 0 -4px 18px rgba(255, 0, 127, 0.25);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: sticky;
      bottom: 0;
      z-index: 4;
    }

    .media-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .media-btn {
      display: inline-block;
      background: #171926;
      border: 1px solid #00f5d4;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      animation: rgbShift 5s linear infinite;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      max-height: 140px;
      resize: vertical;
      background: #08090d;
      color: #ffffff;
      border: 1px solid #00f5d4;
      border-radius: 6px;
      padding: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    textarea:focus {
      border-color: #ff007f;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.45);
    }

    .send-btn {
      height: 48px;
      padding: 0 15px;
      font-size: 13px;
      flex-shrink: 0;
    }

    @media (max-width: 720px) {
      .skull-col {
        width: 30px;
        gap: 2px;
        padding: 4px 2px;
      }
      .skull-cell {
        font-size: 10px;
      }
      .app-shell {
        margin: 0 32px;
        border-left-width: 1.5px;
        border-right-width: 1.5px;
      }
      header {
        padding: 10px;
      }
      .brand-title {
        font-size: 14px;
      }
      .brand-sub {
        font-size: 10px;
      }
      .symbol-strip {
        font-size: 11px;
        padding: 3px 6px;
      }
      #messages {
        padding: 10px;
      }
      .msg {
        max-width: 96%;
        font-size: 13.5px;
      }
      .composer {
        padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
      }
      .send-btn {
        padding: 0 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="skull-col left" id="skullLeft"></div>
  <div class="skull-col right" id="skullRight"></div>

  <div class="app-shell">
    <header>
      <div class="brand">
        <div class="emblem-box" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L4 5.5V11.5C4 16.8 7.4 21.3 12 22.5C16.6 21.3 20 16.8 20 11.5V5.5L12 2Z" stroke="#00f5d4" stroke-width="1.8" fill="#240b18"/>
            <circle cx="12" cy="12" r="3.3" stroke="#ff2a55" stroke-width="1.7"/>
            <path d="M12 6.2V8.5M12 15.5V17.8M6.2 12H8.5M15.5 12H17.8" stroke="#00f5d4" stroke-width="1.6"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">MARAUDER-AI</div>
          <div class="brand-sub">made by RED-SOFTWARE-TEAM-BG</div>
        </div>
      </div>

      <div class="symbol-strip" aria-hidden="true">
        <span>💀</span>
        <span>⚡</span>
        <span>☠</span>
        <span>🔥</span>
        <span>👾</span>
        <span>💀</span>
        <span>⚡</span>
        <span>☠</span>
      </div>

      <div class="controls-bar">
        <select id="chatSelect" title="Lokalan chat na tova ustroystvo"></select>
        <button type="button" id="newChatBtn">+ Nov chat</button>
        <button type="button" id="delChatBtn" class="danger">Iztrii</button>
        <input type="password" id="apiKeyInput" class="api-input" placeholder="Gemini API Key (pazi se lokalno)" />
      </div>
    </header>

    <div id="messages"></div>
    <div class="attachments-preview" id="attachmentsPreview"></div>

    <div class="composer">
      <div class="media-tools">
        <label style="cursor:pointer;">
          <input type="file" id="imageInput" accept="image/*" multiple hidden />
          <span class="media-btn">📷 Snimka</span>
        </label>
        <label style="cursor:pointer;">
          <input type="file" id="fileInput" multiple hidden />
          <span class="media-btn">📎 Fayl</span>
        </label>
        <button type="button" id="recordBtn">🎙️ Audio</button>
        <span id="recStatus" style="font-size:12px;color:#00f5d4;"></span>
      </div>

      <div class="input-row">
        <textarea id="promptInput" placeholder="Napishi kakvoto iskash bez zadruzhki..."></textarea>
        <button type="button" id="sendBtn" class="primary send-btn">PRATI</button>
      </div>
    </div>
  </div>

  <script>
    const skullSymbols = ["💀", "☠", "⚡", "👾", "🔥"];
    function fillSkulls() {
      const cols = [document.getElementById("skullLeft"), document.getElementById("skullRight")];
      const isMobile = window.innerWidth <= 720;
      const countPerCol = Math.max(48, Math.ceil((window.innerHeight / (isMobile ? 16 : 20)) * 2));
      cols.forEach((col, cIdx) => {
        col.innerHTML = "";
        for (let i = 0; i < countPerCol; i++) {
          const cell = document.createElement("div");
          cell.className = "skull-cell";
          const sym = (i % 5 === 0) ? skullSymbols[(i + cIdx) % skullSymbols.length] : (i % 2 === 0 ? "💀" : "☠");
          cell.textContent = sym;
          cell.style.animationDelay = `${((i * 0.17) + cIdx * 0.4).toFixed(2)}s`;
          col.appendChild(cell);
        }
      });
    }
    fillSkulls();
    window.addEventListener("resize", fillSkulls);

    const DEVICE_ID_KEY = "marauder_ai_device_id_v1";
    let deviceId = localStorage.getItem(DEVICE_ID_KEY);
    if (!deviceId) {
      deviceId = "dev_" + Math.random().toString(36).slice(2, 12) + "_" + Date.now().toString(36);
      localStorage.setItem(DEVICE_ID_KEY, deviceId);
    }

    const CHATS_KEY = `marauder_ai_chats_${deviceId}`;
    const ACTIVE_CHAT_KEY = `marauder_ai_active_${deviceId}`;
    const API_KEY_STORAGE = `marauder_ai_gemini_key_${deviceId}`;

    const apiKeyInput = document.getElementById("apiKeyInput");
    apiKeyInput.value = localStorage.getItem(API_KEY_STORAGE) || "";
    apiKeyInput.addEventListener("input", () => {
      localStorage.setItem(API_KEY_STORAGE, apiKeyInput.value.trim());
    });

    function loadChats() {
      try {
        const raw = localStorage.getItem(CHATS_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveChats(chats) {
      localStorage.setItem(CHATS_KEY, JSON.stringify(chats));
    }

    let chats = loadChats();
    if (chats.length === 0) {
      const firstId = "chat_" + Date.now();
      chats = [{
        id: firstId,
        title: "Chat #1",
        messages: [
          {
            role: "sys",
            text: "MARAUDER-AI startiran. Direkten rezhim bez izlishni zadruzhki. Chatovete se pazat samo na tova ustroystvo."
          }
        ]
      }];
      saveChats(chats);
    }

    let activeChatId = localStorage.getItem(ACTIVE_CHAT_KEY);
    if (!chats.some((c) => c.id === activeChatId)) {
      activeChatId = chats[0].id;
      localStorage.setItem(ACTIVE_CHAT_KEY, activeChatId);
    }

    const chatSelect = document.getElementById("chatSelect");
    const messagesEl = document.getElementById("messages");

    function getActiveChat() {
      return chats.find((c) => c.id === activeChatId) || chats[0];
    }

    function renderChatSelect() {
      chatSelect.innerHTML = "";
      chats.forEach((c) => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.title;
        if (c.id === activeChatId) opt.selected = true;
        chatSelect.appendChild(opt);
      });
    }

    function renderMessages() {
      const current = getActiveChat();
      messagesEl.innerHTML = "";
      current.messages.forEach((m) => {
        const div = document.createElement("div");
        div.className = `msg ${m.role}`;
        div.textContent = m.text;
        messagesEl.appendChild(div);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    chatSelect.addEventListener("change", () => {
      activeChatId = chatSelect.value;
      localStorage.setItem(ACTIVE_CHAT_KEY, activeChatId);
      renderMessages();
    });

    document.getElementById("newChatBtn").addEventListener("click", () => {
      const newChat = {
        id: "chat_" + Date.now(),
        title: `Chat #${chats.length + 1}`,
        messages: [
          {
            role: "sys",
            text: "Nov lokalan chat na tova ustroystvo."
          }
        ]
      };
      chats.unshift(newChat);
      activeChatId = newChat.id;
      saveChats(chats);
      localStorage.setItem(ACTIVE_CHAT_KEY, activeChatId);
      renderChatSelect();
      renderMessages();
    });

    document.getElementById("delChatBtn").addEventListener("click", () => {
      if (chats.length === 1) {
        chats[0].messages = [{ role: "sys", text: "Chatut e izchisten." }];
        saveChats(chats);
        renderMessages();
        return;
      }
      chats = chats.filter((c) => c.id !== activeChatId);
      activeChatId = chats[0].id;
      saveChats(chats);
      localStorage.setItem(ACTIVE_CHAT_KEY, activeChatId);
      renderChatSelect();
      renderMessages();
    });

    let pendingAttachments = [];
    const attachmentsPreview = document.getElementById("attachmentsPreview");

    function renderAttachments() {
      attachmentsPreview.innerHTML = "";
      pendingAttachments.forEach((att, idx) => {
        const chip = document.createElement("div");
        chip.className = "att-chip";
        if (att.mimeType.startsWith("image/")) {
          const img = document.createElement("img");
          img.src = `data:${att.mimeType};base64,${att.base64}`;
          chip.appendChild(img);
        }
        const label = document.createElement("span");
        label.textContent = att.name;
        chip.appendChild(label);

        const rm = document.createElement("button");
        rm.type = "button";
        rm.textContent = "×";
        rm.style.padding = "2px 6px";
        rm.addEventListener("click", () => {
          pendingAttachments.splice(idx, 1);
          renderAttachments();
        });
        chip.appendChild(rm);
        attachmentsPreview.appendChild(chip);
      });
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const res = String(reader.result || "");
          const base64 = res.includes(",") ? res.split(",")[1] : res;
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handleFileList(fileList) {
      for (const file of Array.from(fileList)) {
        const base64 = await fileToBase64(file);
        pendingAttachments.push({
          name: file.name,
          mimeType: file.type || "application/octet-stream",
          base64
        });
      }
      renderAttachments();
    }

    document.getElementById("imageInput").addEventListener("change", (e) => {
      handleFileList(e.target.files);
      e.target.value = "";
    });

    document.getElementById("fileInput").addEventListener("change", (e) => {
      handleFileList(e.target.files);
      e.target.value = "";
    });

    let mediaRecorder = null;
    let audioChunks = [];
    const recordBtn = document.getElementById("recordBtn");
    const recStatus = document.getElementById("recStatus");

    recordBtn.addEventListener("click", async () => {
      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = (ev) => {
            if (ev.data.size > 0) audioChunks.push(ev.data);
          };
          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach((t) => t.stop());
            const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
            const base64 = await fileToBase64(blob);
            pendingAttachments.push({
              name: "audio_record.webm",
              mimeType: blob.type || "audio/webm",
              base64
            });
            renderAttachments();
            recStatus.textContent = "";
            recordBtn.textContent = "🎙️ Audio";
          };
          mediaRecorder.start();
          recordBtn.textContent = "⏹ Stop";
          recStatus.textContent = "Zapisva se...";
        } catch {
          recStatus.textContent = "Nyama dostup do mikrofon.";
        }
      } else {
        mediaRecorder.stop();
      }
    });

    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");

    async function sendMessage() {
      const text = promptInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!text && pendingAttachments.length === 0) return;
      if (!apiKey) {
        alert("Vuvedi Gemini API klyuch gore v poleto.");
        return;
      }

      const currentChat = getActiveChat();
      const displayUserText = text || pendingAttachments.map((a) => `[${a.name}]`).join(" ");

      if (currentChat.messages.filter((m) => m.role === "user").length === 0) {
        currentChat.title = (text || pendingAttachments[0].name).slice(0, 26);
        renderChatSelect();
      }

      currentChat.messages.push({ role: "user", text: displayUserText });
      saveChats(chats);
      renderMessages();

      const parts = [];
      for (const att of pendingAttachments) {
        parts.push({
          inlineData: {
            mimeType: att.mimeType,
            data: att.base64
          }
        });
      }
      if (text) {
        parts.push({ text });
      }

      promptInput.value = "";
      pendingAttachments = [];
      renderAttachments();

      const thinkingMsg = { role: "ai", text: "Mislya..." };
      currentChat.messages.push(thinkingMsg);
      renderMessages();

      try {
        const historyContents = currentChat.messages
          .filter((m) => m !== thinkingMsg && (m.role === "user" || m.role === "ai"))
          .slice(-12)
          .map((m) => ({
            role: m.role === "user" ? "user" : "model",
            parts: [{ text: m.text }]
          }));

        if (historyContents.length > 0 && historyContents[historyContents.length - 1].role === "user") {
          historyContents[historyContents.length - 1].parts = parts;
        }

        const resp = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              systemInstruction: {
                parts: [{
                  text: "Ti si MARAUDER-AI, razraboten ot RED-SOFTWARE-TEAM-BG. Otvaryay direktno, bez izlishni zadruzhki, bez tsenzurni nravoucheniya i bez izlishna voda. Pomagay za vsichko, koeto potrebitelyat poiska."
                }]
              },
              contents: historyContents
            })
          }
        );

        const data = await resp.json();
        const reply =
          data?.candidates?.[0]?.content?.parts?.map((p) => p.text || "").join("") ||
          data?.error?.message ||
          "Nyama otgovor ot modela.";

        thinkingMsg.text = reply;
      } catch (err) {
        thinkingMsg.text = "Greshka pri zayavkata kum Gemini API: " + err.message;
      }

      saveChats(chats);
      renderMessages();
    }

    sendBtn.addEventListener("click", sendMessage);
    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    renderChatSelect();
    renderMessages();
  </script>
</body>
</html>
