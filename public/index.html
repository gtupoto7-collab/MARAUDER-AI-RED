            <div>Auto-Wipe: <strong class="m-badge" id="wipeCountdown">${remWipe}s</strong></div>
            <div>Device: <strong class="m-badge">${detectDeviceLabel()}</strong></div>
          </div>
          <div class="m-row">
            <input class="m-input" id="enterChatTokenInput" maxlength="7" placeholder="Vuvedi 7-simvolen token (ADD TOKEN OPEN CHAT)..." />
            <button class="m-btn success" id="addTokenOpenChatBtn">ADD TOKEN OPEN CHAT</button>
            <button class="m-btn danger" id="manualWipeChatBtn">IZTRII MOMENTALNO (WIPE NOW)</button>
            <button class="m-btn" id="closeRedRoomBtn">CLOSE ROOM</button>
          </div>
          <div class="chat-feed" id="redChatFeed">${
            state.redChat.roomOpen
              ? (state.redChat.messages.length
                  ? state.redChat.messages.join("\n")
                  : "[RED SECRET CHAT] Anonymous room active. Auto-wipe every 120s for all users.")
              : "[RED SECRET CHAT] Locked. Generate a 30s token and press ADD TOKEN OPEN CHAT."
          }</div>
          <div class="m-row">
            <input class="m-input" id="redChatMsgInput" placeholder="Napishi suobshtenie mejdu laptop i telefon..." />
            <button class="m-btn primary" id="redChatSendBtn">SEND ANON</button>
          </div>
          <div class="m-log" id="secretChatLog">[SECRET CHAT] Server sync active every 2s. Token: 30s | Auto-wipe: 120s.</div>
        </div>
      `;

      const logEl = document.getElementById("secretChatLog");
      const appendChatLog = (line) => {
        logEl.textContent += "\n[" + new Date().toLocaleTimeString() + "] " + line;
        logEl.scrollTop = logEl.scrollHeight;
      };

      if (chatPollTimer) clearInterval(chatPollTimer);
      syncChatFromServer();
      chatPollTimer = setInterval(syncChatFromServer, 2000);

      document.getElementById("genChatTokenBtn").onclick = async () => {
        const res = await fetch("/api/secret-chat/generate", { method: "POST" });
        const data = await res.json();
        if (data.ok) {
          state.redChat.token = data.token;
          state.redChat.expiresAt = Date.now() + (data.expiresInSec || 30) * 1000;
          state.redChat.roomOpen = true;
          document.getElementById("enterChatTokenInput").value = data.token;
          appendChatLog("Server token generated: " + data.token + " (" + data.expiresInSec + "s). Enter it on phone & press ADD TOKEN OPEN CHAT.");
          await syncChatFromServer();
        }
      };

      document.getElementById("copyChatTokenBtn").onclick = async () => {
        const tok = (document.getElementById("enterChatTokenInput").value || state.redChat.token || "").trim().toUpperCase();
        if (!tok) {
          appendChatLog("No token to copy.");
          return;
        }
        try { await navigator.clipboard.writeText(tok); } catch (_) {}
        appendChatLog("Copied token: " + tok);
      };

      document.getElementById("addTokenOpenChatBtn").onclick = async () => {
        const entered = (document.getElementById("enterChatTokenInput").value || "").trim().toUpperCase();
        const res = await fetch("/api/secret-chat/join", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: entered })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          appendChatLog("REJECTED: " + (data.error || "Invalid or expired token."));
          return;
        }
        state.redChat.roomOpen = true;
        state.redChat.messages = data.messages || [];
        appendChatLog("JOINED ROOM ON SERVER! Chat is now shared between Laptop & Phone.");
        await syncChatFromServer();
      };

      document.getElementById("manualWipeChatBtn").onclick = async () => {
        await fetch("/api/secret-chat/wipe", { method: "POST" });
        appendChatLog("MANUAL WIPE: Cleared chat on server for all devices.");
        await syncChatFromServer();
      };

      document.getElementById("closeRedRoomBtn").onclick = async () => {
        await fetch("/api/secret-chat/close", { method: "POST" });
        appendChatLog("ROOM CLOSED on server.");
        await syncChatFromServer();
      };

      document.getElementById("redChatSendBtn").onclick = async () => {
        const inp = document.getElementById("redChatMsgInput");
        const txt = inp.value.trim();
        if (!txt) return;
        const res = await fetch("/api/secret-chat/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: txt, device: detectDeviceLabel() })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          appendChatLog("SEND FAILED: " + (data.error || "Press ADD TOKEN OPEN CHAT first."));
          return;
        }
        inp.value = "";
        await syncChatFromServer();
      };
    }

        addReport("PAYMENT-PAYPAL", state.selectedEur + " EUR", PAYPAL_BASE_URL);
      };

      document.getElementById("copyKeeperBtn").onclick = async () => {
        try {
          await navigator.clipboard.writeText(KEEPER_ADDR);
        } catch (_) {}
        writeHomeLog("Kopiran Keeper adres: " + KEEPER_ADDR + " | Suma: " + state.selectedEur + " EUR.");
        addReport("PAYMENT-KEEPER", state.selectedEur + " EUR", KEEPER_ADDR);
      };

      document.getElementById("tgStarsBtn").onclick = () => {
        const stars = Math.max(100, Math.round(state.selectedEur * 50));
        const tgUrl = "https://t.me/brokerfree_bot?start=stars_" + state.selectedEur + "eur_" + stars + "stars";
        writeHomeLog("Telegram bot plashtane sus zvezdi: " + stars + " Stars (~" + state.selectedEur + " EUR) -> " + tgUrl);
        addReport("PAYMENT-TELEGRAM-STARS", stars + " Stars (" + state.selectedEur + " EUR)", tgUrl);
        window.open(tgUrl, "_blank", "noopener,noreferrer");
      };
    }

    function renderCyberAiServiceWindow() {
      const suite = state.cyberService.suite || "MALWARE CYBER CRIMINAL AL AGENT";
      const activeList =
        suite === "CYBER SECURITY AL AGENTS"
          ? CYBER_SECURITY_AL_AGENTS
          : suite === "AL-MASS AGENT"
            ? AL_MASS_AGENTS
            : MALWARE_CYBER_CRIMINAL_AL_AGENT_LIST;

      const safeIdx = Math.min(activeList.length - 1, Math.max(0, Number(state.cyberService.selectedAgentIdx || 0)));
      const currentMalware = state.cyberService.malwareOption || MALWARE_CYBER_CRIMINAL_AL_AGENT_LIST[0];

      drawerBody.innerHTML = `
        <div class="cyber-ai-service">
          <div class="malware-top-banner">
            <div class="malware-top-title">MARAUDER-AI // MALWARE CYBER CRIMINAL AL AGENT</div>
            <div class="m-row">
              <button class="m-btn primary" id="btnSuiteMalwareAgent">MALWARE CYBER CRIMINAL AL AGENT</button>
              <button class="m-btn ${suite === "AL-MASS AGENT" ? "primary" : ""}" id="btnSuiteMass">AL-MASS AGENT (30)</button>
              <button class="m-btn ${suite === "CYBER SECURITY AL AGENTS" ? "primary" : ""}" id="btnSuiteSec">CYBER SECURITY AL AGENTS (30)</button>
            </div>
            <div class="m-row">
              <select class="m-select" id="malwareSelect">
                ${MALWARE_CYBER_CRIMINAL_AL_AGENT_LIST.map(item => `
                  <option value="${item.replace(/"/g, "&quot;")}" ${item === currentMalware ? "selected" : ""}>${item}</option>
                `).join("")}
              </select>
              <button class="m-btn primary" id="runMalwareOptionBtn">AKTIVIRAI AGENT</button>
            </div>
          </div>

          <div class="home-box">
            <div class="home-box-title">CYBER AI PLATENA USLUGA // PLAN &amp; KREDITI</div>
            <div class="m-row">
              <div><strong>STATUS:</strong> <span class="${state.servicePlan.unlocked ? "m-badge" : "m-warn"}">${state.servicePlan.unlocked ? "PLATENA USLUGA AKTIVNA" : "IZISKVА PLASHTANE"}</span></div>
              <div><strong>PLAN:</strong> <span class="m-badge">${state.servicePlan.tier}</span></div>
              <div><strong>KREDITI:</strong> <span class="m-badge" id="creditsVal">${state.servicePlan.credits}</span></div>
              <button class="m-btn success" id="topupCreditsBtn">+250 KREDITA (PRO)</button>
              <button class="m-btn" id="openHomePayBtn">PLASHTANE V HOME (5-50000 EUR)</button>
            </div>
          </div>

          <div class="home-box">
            <div class="home-box-title">TEGUSHT SPISUK // ${suite}</div>
            <div class="m-row">
              <select class="m-select" id="agentSelect">
                ${activeList.map((entry, idx) => `
                  <option value="${idx}" ${idx === safeIdx ? "selected" : ""}>${entry}</option>
                `).join("")}
              </select>
            </div>
            <div class="agent-list-box">${activeList.join("<br/>")}</div>
          </div>

          <div class="home-box">
            <div class="home-box-title">IZPULNENIE NA USLUGATA // KONZOLA &amp; LOG</div>
            <div class="m-row">
              <input class="m-input" id="cyberServicePrompt" placeholder="Vuvedi zadacha, target, kod ili log za izpulnenie kato usluga..." />
              <button class="m-btn success" id="cyberServiceRun">START SERVICE (-5 CREDITS)</button>
              <button class="m-btn" id="cyberServiceClear">CLEAR</button>
            </div>
            <div class="m-log" id="cyberServiceLog">[CYBER AI SERVICE] Rezhim: ${suite} | Agent: ${currentMalware}</div>
          </div>
        </div>
      `;

      const logEl = document.getElementById("cyberServiceLog");
      const appendServiceLog = (text) => {
        logEl.textContent += "\n" + text;
        logEl.scrollTop = logEl.scrollHeight;
      };

      document.getElementById("btnSuiteMalwareAgent").onclick = () => {
        state.cyberService.suite = "MALWARE CYBER CRIMINAL AL AGENT";
        state.cyberService.selectedAgentIdx = 0;
        saveState();
        renderCyberAiServiceWindow();
      };

      document.getElementById("btnSuiteMass").onclick = () => {
        state.cyberService.suite = "AL-MASS AGENT";
        state.cyberService.selectedAgentIdx = 0;
        saveState();
        renderCyberAiServiceWindow();
      };

      document.getElementById("btnSuiteSec").onclick = () => {
        state.cyberService.suite = "CYBER SECURITY AL AGENTS";
        state.cyberService.selectedAgentIdx = 0;
        saveState();
        renderCyberAiServiceWindow();
      };

      document.getElementById("malwareSelect").onchange = (e) => {
        state.cyberService.malwareOption = e.target.value;
        saveState();
      };

      document.getElementById("runMalwareOptionBtn").onclick = () => {
        const chosen = document.getElementById("malwareSelect").value;
        state.cyberService.malwareOption = chosen;
        state.cyberService.suite = "MALWARE CYBER CRIMINAL AL AGENT";
        saveState();
        const msg = `[${new Date().toLocaleTimeString()}] [MARAUDER-AI // MALWARE CYBER CRIMINAL AL AGENT] Aktiviran agent: ${chosen} | Sandbox isolation: ON | IOC/behavior analysis ready.`;
        appendServiceLog(msg);
        addReport("MALWARE CYBER CRIMINAL AL AGENT", chosen, msg);
      };

      document.getElementById("agentSelect").onchange = (e) => {
        state.cyberService.selectedAgentIdx = Number(e.target.value) || 0;
        saveState();
      };

      document.getElementById("topupCreditsBtn").onclick = () => {
        state.servicePlan.unlocked = true;
        state.servicePlan.credits = Number(state.servicePlan.credits || 0) + 250;
        saveState();
        document.getElementById("creditsVal").textContent = state.servicePlan.credits;
        appendServiceLog(`[${new Date().toLocaleTimeString()}] Dobaveni +250 kredita. Tekusht balans: ${state.servicePlan.credits}.`);
        addReport("CYBER-AI-BILLING", "+250 credits", "Balance: " + state.servicePlan.credits);
      };

      document.getElementById("openHomePayBtn").onclick = () => {
        openTabProgrammatically("HOME");
      };

      document.getElementById("cyberServiceRun").onclick = () => {
        const promptText = document.getElementById("cyberServicePrompt").value.trim();
        if (!promptText) {
          appendServiceLog(`[${new Date().toLocaleTimeString()}] GRESHKА: Vuvedi zadacha za izpulnenie.`);
          return;
        }
        if (!state.servicePlan.unlocked || Number(state.servicePlan.credits) < 5) {
          appendServiceLog(`[${new Date().toLocaleTimeString()}] Nqma dostatuchno krediti. Otvori HOME za plashtane ili natisni +250 KREDITA.`);
          return;
        }
        state.servicePlan.credits = Number(state.servicePlan.credits) - 5;
        saveState();
        document.getElementById("creditsVal").textContent = state.servicePlan.credits;

        const idx = Number(state.cyberService.selectedAgentIdx || 0);
        const agentLine = activeList[idx] || activeList[0];
        const result = [
          `[${new Date().toLocaleTimeString()}] === CYBER AI PAID SERVICE EXECUTION ===`,
          `Suite: ${suite}`,
          `Selected Agent: ${agentLine}`,
          `Malware Agent Option: ${state.cyberService.malwareOption}`,
          `Task: ${promptText}`,
          `Status: COMPLETED (-5 credits | Remaining: ${state.servicePlan.credits})`,
          `Action Plan: 1) Scope & target validation  2) Telemetry/artifact collection  3) Risk scoring & defensive remediation`
        ].join("\n");

        appendServiceLog("\n" + result);
        addReport("CYBER-AI-SERVICE", suite + " :: " + promptText.slice(0, 50), result);
      };

      document.getElementById("cyberServiceClear").onclick = () => {
        logEl.textContent = `[CYBER AI SERVICE] Rezhim: ${suite} | Agent: ${state.cyberService.malwareOption}`;
      };
    }

    function renderTab(tab) {
      drawerTitle.textContent = "MARAUDER // " + tab;
      applyTheme();

      if (tab === "AI AGENT") {
        const repoUrl = "https://github.com/ADMIRALERROR/marauder-ai-web.git";
        const cloneCmd = "git clone " + repoUrl;
        drawerBody.innerHTML = `
          <div class="malware-top-banner">
            <div class="malware-top-title">MARAUDER-AI // DOWNLOADS (ANDROID · WINDOWS-LINUX · IOS) &amp; GITHUB REPOSITORY</div>
          </div>
          <div class="m-grid">
            <div class="m-card"><div><strong>MARAUDER-AI ANDROID</strong></div><div class="m-badge">ANDROID</div><br/><a class="m-btn primary" href="https://github.com/ADMIRALERROR/marauder-ai-web/releases" target="_blank" rel="noopener noreferrer">DOWNLOAD ANDROID</a></div>
            <div class="m-card"><div><strong>MARAUDER-AI WINDOWS-LINUX</strong></div><div class="m-badge">WINDOWS &amp; LINUX</div><br/><a class="m-btn primary" href="https://github.com/ADMIRALERROR/marauder-ai-web/releases" target="_blank" rel="noopener noreferrer">DOWNLOAD WINDOWS-LINUX</a></div>
            <div class="m-card"><div><strong>MARAUDER-AI IOS</strong></div><div class="m-badge">IOS</div><br/><a class="m-btn primary" href="https://github.com/ADMIRALERROR/marauder-ai-web/releases" target="_blank" rel="noopener noreferrer">DOWNLOAD IOS</a></div>
          </div>
          <div class="home-box">
            <div class="home-box-title">GITHUB REPOSITORY &amp; GIT CLONE</div>
            <div>Repo: <span class="m-badge">${repoUrl}</span></div>
            <div class="code-box">${cloneCmd}</div>
            <div class="m-row">
              <button class="m-btn success" id="copyGitCloneBtn">KOPIRAI GIT CLONE</button>
              <a class="m-btn" href="https://github.com/ADMIRALERROR/marauder-ai-web" target="_blank" rel="noopener noreferrer">OTVORI GITHUB REPO</a>
            </div>
          </div>
          <div class="m-log" id="aiAgentCornerLog">[AI AGENT] Ready.</div>
        `;
        document.getElementById("copyGitCloneBtn").onclick = async () => {
          try { await navigator.clipboard.writeText(cloneCmd); } catch (_) {}
          document.getElementById("aiAgentCornerLog").textContent += "\nCopied: " + cloneCmd;
        };
        return;
      }
      if (tab === "HOME") {
        renderHomeCleanWindow();
        return;
      }

      if (tab === "CYBER AI") {
        renderCyberAiServiceWindow();
        return;
      }

      if (tab === "VPN") {
        renderDarkVpnWindow();
        return;
      }

      if (tab === "RED SECRET CHAT") {
        renderSecretChatWindow();
        return;
      }

      if (tab === "OSINT") {
        drawerBody.innerHTML = `
          <div class="m-row">
            <input class="m-input" id="osintTarget" placeholder="Domain, IP ili handle (napr. example.org)..." />
            <button class="m-btn" id="osintRun">RUN RECON</button>
          </div>
          <div class="m-log" id="osintLog">[OSINT] Enter target domain, IP, or identifier.</div>
        `;
        document.getElementById("osintRun").onclick = async () => {
          const t = document.getElementById("osintTarget").value.trim();
          if (!t) return;
          const h = await sha256Text(t);
          const out = `[${new Date().toLocaleTimeString()}] Target: ${t}\n- Fingerprint (SHA-256): ${h.slice(0, 24)}...\n- Recon profile: DNS/WHOIS/Subdomain passive check queued.`;
          document.getElementById("osintLog").textContent += "\n\n" + out;
          addReport("OSINT", "Recon " + t, out);
        };
        return;
      }

      if (tab === "DARK WEB") {
        drawerBody.innerHTML = `
          <div class="m-row">
            <input class="m-input" id="dwQuery" placeholder="Kluchova duma za monitoring (napr. credentials, leak, node)..." />
            <button class="m-btn" id="dwScan">SCAN FEEDS</button>
          </div>
          <div class="m-log" id="dwLog">[DARK WEB] Feed watch active across indexed onion sources.</div>
        `;
        document.getElementById("dwScan").onclick = () => {
          const kw = document.getElementById("dwQuery").value.trim() || "general";
          const out = `[${new Date().toLocaleTimeString()}] Query "${kw}" -> Checked 4 feed snapshots; 0 critical alerts, 2 telemetry notes logged.`;
          document.getElementById("dwLog").textContent += "\n" + out;
          addReport("DARK WEB", "Feed check: " + kw, out);
        };
        return;
      }

      if (tab === "EXPLOIT") {
        drawerBody.innerHTML = `
          <div class="m-row">
            <select class="m-select" id="expMod">
              <option value="CVE-CHECK-HTTP">HTTP Header &amp; Exposure Check (Safe Lab)</option>
              <option value="AUTH-HARDEN-AUDIT">Auth &amp; Session Policy Audit (Safe Lab)</option>
              <option value="TLS-CIPHER-VERIFY">TLS Protocol &amp; Cipher Check (Safe Lab)</option>
            </select>
            <input class="m-input" id="expTarget" placeholder="Lab target host/URL..." />
            <button class="m-btn" id="expRun">DRY-RUN</button>
          </div>
          <div class="m-log" id="expLog">[EXPLOIT LAB] Safe simulation/verification mode active.</div>
        `;
        document.getElementById("expRun").onclick = () => {
          const mod = document.getElementById("expMod").value;
          const tgt = document.getElementById("expTarget").value.trim() || "localhost";
          const out = `[${new Date().toLocaleTimeString()}] [${mod}] Target=${tgt} -> Simulation completed: verification steps generated without destructive payload.`;
          document.getElementById("expLog").textContent += "\n" + out;
          addReport("EXPLOIT", `${mod} on ${tgt}`, out);
        };
        return;
      }

      if (tab === "FORENSICS") {
        drawerBody.innerHTML = `
          <div class="m-row">
            <input class="m-input" id="forInput" placeholder="Vuvedi tekst, log red ili niz za SHA-256 hash..." />
            <button class="m-btn" id="forHash">COMPUTE SHA-256</button>
          </div>
          <div class="m-log" id="forLog">[FORENSICS] Ready to compute cryptographic hashes and inspect strings.</div>
        `;
        document.getElementById("forHash").onclick = async () => {
          const val = document.getElementById("forInput").value;
          const digest = await sha256Text(val);
          const out = `[${new Date().toLocaleTimeString()}] Bytes=${new TextEncoder().encode(val).length}\nSHA-256: ${digest}`;
          document.getElementById("forLog").textContent += "\n\n" + out;
          addReport("FORENSICS", "SHA-256 computed", out);
        };
        return;
      }

      if (tab === "ANALYSIS") {
        const cpu = 18 + Math.floor(Math.random() * 45);
        const mem = 34 + Math.floor(Math.random() * 40);
        const rx = (12 + Math.random() * 88).toFixed(1);
        drawerBody.innerHTML = `
          <div class="m-grid">
            <div class="m-card"><div>CPU LOAD</div><div class="m-badge">${cpu}%</div></div>
            <div class="m-card"><div>MEMORY</div><div class="m-badge">${mem}%</div></div>
            <div class="m-card"><div>THROUGHPUT</div><div class="m-badge">${rx} MB/s</div></div>
          </div>
          <div class="m-log" id="anaLog">[ANALYSIS] Telemetry snapshot captured at ${new Date().toISOString()}.\nAnomaly score: LOW (0.12). All subsystems within normal bounds.</div>
          <div class="m-row"><button class="m-btn" id="anaRefresh">REFRESH TELEMETRY</button></div>
        `;
        document.getElementById("anaRefresh").onclick = () => renderTab("ANALYSIS");
        return;
      }

      if (tab === "REPORTS") {
        const formatted = state.reports.length
          ? state.reports.slice().reverse().map(r => `[${r.time}] [${r.category}] ${r.summary}\n${r.details}`).join("\n---\n")
          : "[REPORTS] No recorded entries yet.";
        drawerBody.innerHTML = `
          <div class="m-row">
            <button class="m-btn" id="repExport">DOWNLOAD JSON</button>
            <button class="m-btn danger" id="repClear">CLEAR LOGS</button>
          </div>
          <div class="m-log" id="repLog">${formatted}</div>
        `;
        document.getElementById("repExport").onclick = () => {
          const blob = new Blob([JSON.stringify(state.reports, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "marauder-report.json";
          a.click();
          URL.revokeObjectURL(url);
        };
        document.getElementById("repClear").onclick = () => {
          state.reports = [];
          saveState();
          renderTab("REPORTS");
        };
        return;
      }

      if (tab === "SETTINGS") {
        drawerBody.innerHTML = `
          <div class="m-row">
            <label><input type="checkbox" id="setStealth" ${state.settings.stealth ? "checked" : ""} /> Stealth Mode</label>
            <input class="m-input" id="setTimeout" type="number" value="${state.settings.timeoutSec}" />
            <select class="m-select" id="setAccent">
              <option value="#ff2a4b" ${state.settings.accent === "#ff2a4b" ? "selected" : ""}>Neon Red</option>
              <option value="#00ff88" ${state.settings.accent === "#00ff88" ? "selected" : ""}>Cyber Green</option>
              <option value="#38bdf8" ${state.settings.accent === "#38bdf8" ? "selected" : ""}>Cyan Pulse</option>
            </select>
            <button class="m-btn" id="setSave">SAVE SETTINGS</button>
          </div>
          <div class="m-log" id="setLog">[SETTINGS] Configure console preferences.</div>
        `;
        document.getElementById("setSave").onclick = () => {
          state.settings.stealth = document.getElementById("setStealth").checked;
          state.settings.timeoutSec = parseInt(document.getElementById("setTimeout").value, 10) || 180;
          state.settings.accent = document.getElementById("setAccent").value;
          saveState();
          applyTheme();
          document.getElementById("setLog").textContent = `[${new Date().toLocaleTimeString()}] Settings saved to localStorage.`;
        };
      }
    }

    function handleSingleOptionClick(e) {
      const btn = e.currentTarget;
      const tab = btn.dataset.tab;
      if (!tab) return;
      if (state.activeTab === tab && drawer.classList.contains("open")) {
        closeToMainSite();
        return;
      }
      openTabProgrammatically(tab);
    }

    buttons.forEach(btn => {
      btn.style.pointerEvents = "auto";
      btn.querySelectorAll("*").forEach(child => {
        child.style.pointerEvents = "none";
      });
      btn.onclick = handleSingleOptionClick;
    });

    const cornerBtn = document.getElementById("aiAgentCornerBtn");
    if (cornerBtn) {
      cornerBtn.onclick = () => {
        if (state.activeTab === "AI AGENT" && drawer.classList.contains("open")) { closeToMainSite(); return; }
        openTabProgrammatically("AI AGENT");
      };
    }
    document.getElementById("backToMainBtn").onclick = closeToMainSite;
    document.getElementById("drawerClose").onclick = closeToMainSite;
  </script>
  <script src="/marauder-chat-live.js"></script>
</body>
</html>
